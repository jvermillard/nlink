# cargo-deny configuration (fleet standard, myserver#33: cargo-deny is the
# single supply-chain lint). See https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
ignore = [
    # serde_yaml 0.9 (deprecated) pulls it, for the nlink-config demo bin
    # only; unmaintained, not a known vulnerability. Drop with #747.
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml via serde_yaml in bins/config only; migration tracked in #747" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The publish = false bins depend on the library crates by bare workspace
# path (no version) — that is fine for private crates.
allow-wildcard-paths = true
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
